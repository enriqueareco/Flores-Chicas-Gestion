<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campo Flores Chicas</title>
<meta name="theme-color" content="#1F2A22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="marca">Flores Chicas<small>Gestión agrícola</small></div>
  <nav class="tabs" id="tabs">
    <a href="#mapa" data-v="mapa">Mapa</a>
    <a href="#cargar" data-v="cargar">Cargar</a>
    <a href="#labores" data-v="labores">Labores</a>
    <a href="#aplicaciones" data-v="aplicaciones">Aplicaciones</a>
    <a href="#ordenes" data-v="ordenes">Órdenes</a>
    <a href="#comprobantes" data-v="comprobantes">Comprobantes</a>
    <a href="#insumos" data-v="insumos">Insumos</a>
    <a href="#proveedores" data-v="proveedores">Proveedores</a>
    <a href="#catalogo" data-v="catalogo">Catálogo</a>
  </nav>
  <div class="acc">
    <span class="modo" id="modoChip" hidden>MODO PRUEBA</span>
    <select id="selCamp" aria-label="Campaña"></select>
    <button id="btnCuenta" title="Cuenta y datos">☰</button>
  </div>
</header>

<main>
  <section class="view" id="v-mapa" hidden>
    <div class="mapwrap"><div id="map"></div>
      <div class="maptools">
        <button class="primary" id="btnDraw">✎ Dibujar lote</button>
        <button id="btnKmz">Importar KMZ</button>
        <select id="selBase" aria-label="Fondo del mapa"><option value="sat">Satélite Esri</option><option value="sat2">Satélite Esri Clarity</option><option value="s2">Sentinel-2 sin nubes</option><option value="osm">Calles</option></select>
      </div>
      <div id="legend" class="legend" hidden></div><div id="coord" class="coord">—</div></div>
    <aside class="ficha"><div class="scroll" id="panel"></div></aside>
  </section>
  <section class="view page" id="v-cargar" hidden></section>
  <section class="view page" id="v-labores" hidden></section>
  <section class="view page" id="v-aplicaciones" hidden></section>
  <section class="view page" id="v-ordenes" hidden></section>
  <section class="view page" id="v-comprobantes" hidden></section>
  <section class="view page" id="v-insumos" hidden></section>
  <section class="view page" id="v-catalogo" hidden></section>
  <section class="view page" id="v-proveedores" hidden></section>
</main>

<nav class="bottom" id="bottom">
  <a href="#mapa" data-v="mapa"><span class="i">◫</span>Mapa</a>
  <a href="#labores" data-v="labores"><span class="i">⚒</span>Labores</a>
  <a href="#cargar" data-v="cargar" class="mas"><span class="i">+</span>Cargar</a>
  <a href="#ordenes" data-v="ordenes"><span class="i">☑</span>Órdenes</a>
  <a href="#mas" data-v="mas"><span class="i">⋯</span>Más</a>
</nav>

<div id="imprimir" hidden></div>
<input type="file" id="fKmz" accept=".kmz,.kml" hidden>
<input type="file" id="fRinde" accept=".zip,.shp,.dbf,.prj,.cpg,.shx" multiple hidden>
<input type="file" id="fProj" accept=".json" hidden>
<input type="file" id="fFoto" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="fDoc" accept="application/pdf,image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script src="https://unpkg.com/shpjs@4.0.4/dist/shp.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/mapa.js"></script>
<script src="js/insumos.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/proveedores.js"></script>
<script src="js/comprobantes.js"></script>
<script src="js/labores.js"></script>
<script src="js/ordenes.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
